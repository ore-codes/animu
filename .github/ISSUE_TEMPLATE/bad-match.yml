name: Bad match
description: Animu returned the wrong episode
labels: [search]
body:
  - type: input
    id: show
    attributes:
      label: Show
      placeholder: Hunter x Hunter (2011)
    validations:
      required: true
  - type: textarea
    id: query
    attributes:
      label: What you typed
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Episode you expected
      description: Number and title. Keep plot details out of this field.
    validations:
      required: true
  - type: input
    id: got
    attributes:
      label: Episode you got
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Put spoilers here, not in the fields above.
